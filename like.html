<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Like Button</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #btn {
      font-size: 40px;
      cursor: pointer;
      user-select: none;
    }
    #count {
      font-size: 30px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="btn">❤️</div>
  <div id="count">0</div>

  <script>
    let count = 0;
    const btn = document.getElementById("btn");
    const countDisplay = document.getElementById("count");

    btn.addEventListener("click", () => {
      count++;
      countDisplay.textContent = count;
    });
  </script>

</body>
</html>
