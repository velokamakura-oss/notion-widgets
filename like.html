<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Like Button Small</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    .like-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 24px;
      padding: 6px 10px;
    }

    #btn {
      cursor: pointer;
      user-select: none;
    }

    #count {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="like-box">
    <div id="btn">👍</div>
    <div id="count">0</div>
  </div>

  <script>
    let count = 0;
    const btn = document.getElementById("btn");
    const countDisplay = document.getElementById("count");

    btn.addEventListener("click", () => {
      count++;
      countDisplay.textContent = count;
    });
  </script>
　
</body>
</html>
